name: Build

on:
  pull_request:

  # allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # allow the workflow to be re-used in other workflows
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      # The e2e suite runs the real broadcast pipeline against real
      # PostgreSQL (same major as production), with Discord mocked in-process.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: steammy_dev
          POSTGRES_USER: steammy_dev
          POSTGRES_PASSWORD: steammy_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_NAME: steammy_dev
      DATABASE_USER: steammy_dev
      DATABASE_PASSWORD: steammy_dev
      DATABASE_SSL: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Type check
        run: npm run type:check

      - name: Run linters
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Assert compiled migrations contain no import statements
        run: |
          shopt -s nullglob
          files=(dist/database/migrations/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No compiled migrations found in dist/database/migrations"
            exit 1
          fi
          if grep -nE "^[[:space:]]*import[[:space:]{]" "${files[@]}"; then
            echo "Compiled migrations must not contain import statements"
            exit 1
          fi

      - name: Run unit tests
        run: npm run test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Run e2e tests
        run: npm run test:e2e

  migrations:
    name: Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: steammy_bot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BOT_TOKEN: ci-token
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: steammy_bot
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SSL: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Create the database schema
        run: npm run db:init

      - name: Apply migrations
        run: npm run migration:run

      - name: Re-apply migrations to prove they are idempotent
        run: npm run migration:run

      - name: Show applied migrations
        run: npm run migration:show
