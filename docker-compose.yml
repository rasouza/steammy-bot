version: '3'

services:

  # ==== Application ====

  app:
    image: ghcr.io/rasouza/steammy-bot:latest
    pull_policy: always
    volumes:
        - ./logs/:/app/logs
        - ./assets:/app/assets
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BOT_TOKEN=${BOT_TOKEN}
      - TEST_GUILD_ID=${TEST_GUILD_ID}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_SSL=${DATABASE_SSL}
      - API_PORT=${API_PORT}
    # depends_on:
    #   - database

  
  # ==== PostgreSQL database ====

  database:
    # Pinned major: matches the production server (verified with SELECT
    # version() → PostgreSQL 18.6) so migrations behave locally as in prod.
    image: postgres:18
    container_name: database
    restart: always
    volumes:
      - steammy-dev-data:/var/lib/postgresql/data
    environment:
      # Throwaway container defaults so a fresh clone can run the database —
      # and the e2e suite — with no DATABASE_* entries in .env.
      - POSTGRES_DB=${DATABASE_NAME:-steammy_dev}
      - POSTGRES_USER=${DATABASE_USER:-steammy_dev}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-steammy_dev}
    ports:
      # Loopback only — the local database is never reachable from the network.
      - 127.0.0.1:5432:5432
    healthcheck:
      # Lets `docker compose up -d --wait database` block until Postgres is
      # ready, so db:init never races an uninitialized server.
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER:-steammy_dev} -d ${DATABASE_NAME:-steammy_dev}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ==== MySQL database ====

  # database:
  #   image: mysql # or `mariadb`
  #   container_name: database
  #   restart: always
  #   volumes:
  #     - ./data:/var/lib/mysql:rw
  #   environment:
  #     - MYSQL_DATABASE=${DATABASE_NAME}
  #     - MYSQL_USER=${DATABASE_USER}
  #     - MYSQL_PASSWORD=${DATABASE_PASSWORD}
  #     - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD}
  #   ports:
  #     - 3306:3306

volumes:
  steammy-dev-data: